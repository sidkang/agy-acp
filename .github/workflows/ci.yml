name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - name: typecheck
        run: HOME=$(mktemp -d) bun x tsc --noEmit
      - name: test
        run: HOME=$(mktemp -d) bun test
